# QuantStar LLM 提供方配置 — 中性默认
#
# 本文件是**开源默认**，任何用户都可直接使用。私有网关、本机数据库路径、
# 个人 key 一律不得出现在这里（Issue #15）——请放进 config/local.yaml。
#
# 覆盖方式（按优先级，后者覆盖前者）：
#   config/defaults/*.yaml → config/settings.yaml → config/profiles/<env>.yaml → config/local.yaml
# 所以只需在 config/local.yaml 里写你想覆盖的字段，无需改本文件。
# 完整示例见 config/local.yaml.example。
#
# ⚠️ 注意：配置加载器只支持 ${a.b} 形式的**键引用**，不做 shell 式环境变量
#    展开。API key 请用 api_key_env 指定环境变量**名**，由客户端在运行时读取。
#
# ── 字段说明 ────────────────────────────────────────────────────────────
# providers: 按 priority 升序尝试（数字小的先试）。
#   name            本名（日志里可辨认）
#   url             OpenAI 兼容的 /v1/chat/completions 完整地址
#   model           模型 ID
#   api_key_env     从环境变量读 key 的**变量名**（推荐，key 不落盘）
#   key_source      可选，从 sqlite 只读查询 key（私有网关用法，见 local.yaml.example）
#   rate_limit      每分钟请求上限
#   timeout         单次请求超时（秒）
#   reasoning_floor 推理模型的 max_tokens 预算下限（推理模型给小了会 200 但空）
#   priority        链序，小的先试
#
# rotation:
#   strict_priority  严格按 priority 走链，不轮换（确定性链序）
#   （缺省）          轮换
#
# enable_discovery: 是否自动发现可用模型
#
llm:
  enable_discovery: false
  rotation: strict_priority

  providers:
    # ── 默认链：OpenAI 兼容端点，key 从环境变量 QS_LLM_API_KEY 读 ────────
    # 换成你自己的服务只需二选一：
    #   a) 设环境变量 QS_LLM_API_KEY，并在此改 url/model；或
    #   b) 完全覆盖：在 config/local.yaml 里重写整个 providers 列表（见示例）。
    - name: primary
      url: https://api.openai.com/v1/chat/completions
      model: gpt-4o-mini
      api_key_env: QS_LLM_API_KEY
      rate_limit: 20
      timeout: 60
      priority: 1

    # ── 备份链：同一个 key，换一个模型兜底 ──────────────────────────────
    - name: fallback
      url: https://api.openai.com/v1/chat/completions
      model: gpt-4o-mini
      api_key_env: QS_LLM_API_KEY
      rate_limit: 10
      timeout: 45
      priority: 2

  cache:
    max_size: 500
    default_ttl: 3600
