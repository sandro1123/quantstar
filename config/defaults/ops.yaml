      description: "LLM Provider 联通性检查 (每5分钟)，由 Ops 内部定时器管理"

  # P0-7 方向B: cron 看门狗预算 — scripts/cron_watchdog.sh 运行时读本段派生超时
  # (D-31 单一事实源: crontab 不硬编码数字, ops.yaml 改了包装器自动跟随)
  # 总预算 = timeout_s + grace_s; 超预算先 SIGTERM, 宽限期后 SIGKILL, 锁随进程死亡释放
  # P0-3① 心跳模型: 管道超期未成功主动告警 (ops_layer/heartbeat_check.py)
  # grace_s = 排程时刻+执行预算之后的基础宽限; overrides 按管道覆盖
  # (长管道/依赖链的实际完成时刻晚于公式估计时上调, 防误报)。
  heartbeat:
    grace_s: 1800
    overrides:
      daily_data_pipeline: 3600   # ddp 实测 91min, 预算公式外再给 1h 宽限
      evening_report: 3600        # 依赖链末端, 等待窗+执行叠加
  cron_watchdog:
    grace_s: 120
    overrides:            # 非管道入口 (scripts/* 直驱) 的预算键
      intraday_scan: 120
      # daily_update: 已被上方 ops.pipelines.daily_update 段取代 (2026-09-25)。
      # cron_watchdog.sh 的预算派生是 `if key in pipelines` 二选一, 一旦该 key
      # 进了 pipelines 段, 本 overrides 值**不再被读** —— 留着会成为漂移源
      # (后人改它会以为生效)。预算现由 pipelines 段的 timeout_s=300 承载, 仍是 420s。
      daily_update: 300
      e2e_verification: 600
      api_health_check: 60

  # AG-QUOTA-2 件1 (2026-09-11): 配额真源 — 9router usageDaily sqlite mode=ro
  # 直读 (照 llm.yaml key_source 同款通道先例)。degraded 显式位禁静默。
  agent:
    quota:
      daily_budget_requests: 3000     # Agent key 日预算 (当日真 requests)
      daily_budget_cost: 5.0          # 日成本预算 ($)
      low_remaining_pct: 0.30         # 剩余<30% 触发保守降级
      source_path: ~/.10router/db/data.sqlite
      api_key_hint: Hermes-Agent        # byApiKey 前缀匹配 hint (10router 有效 key)

  # Q4: BEGIN IMMEDIATE 锁健康探针 — scripts/lock_probe.py 运行时读本段
  # (铁律 #9 例外已获批, 三约束: 短 busy_timeout / try-finally rollback / 频率限制,
  #  另保留 ro 降级路径; 三分支 healthy=0 locked=3 degraded=4)
  lock_probe:
    busy_timeout_ms: 2000   # 约束1: 撞锁最多等 2s 即返回 locked, 绝不长阻塞
    min_interval_s: 60      # 约束3: 频率限制, 距上次探针不足 60s 跳过 (--force 绕过)

  # W2 卡⑤ (2026-09-20): GFS 分级备份保留 — 恢复深度 7 天 → 7日+4周+6月。
  # 磁盘数学 (2026-09-20 实测): 3.7GB/份, 单档 7 份 = 25.9GB 恒定; GFS 稳态
  # ≈17 份 ≈63GB (同份多档重叠不重复占空间), free 102G 内承受。
  # gz 增速实测 +0.0078GB/日 (3.5G 是单份大小非日增量, 勘误)。
  backup:
    keep_daily: 7
    keep_weekly: 4
    keep_monthly: 6

  # F2.5: 交易日 kline 分表覆盖率下限 (低于此值判该日 failed, 防假成功)
  min_kline_rows: 4000
  # db_backup/disk_check 卡 (2026-09-05): disk_check 双判据阈值 — Config
  # 全键空间属主 (#108 _cfg_all 先例, 禁 pipeline-block-scope 读法)。
  #   disk_warning_pct / disk_alert_pct: df 口径 (used/(used+avail), f_bavail 基排除 root
  #     保留块) 百分比阈值 — 旧 shutil 口径恒偏 4.52pt 物理上限 95%,
  #     `>90` 实际触发线 df ~94.5% 缓冲仅 ~1.2G, 09-03/04 全天盲区零告警实证。
  #   disk_alert_floor_gb: 绝对余量地板 (GB, 三口径并存时唯一无歧义锚)
  disk_warning_pct: 85
  disk_alert_pct: 92
  disk_alert_floor_gb: 20

  # 机制卡 (2026-09-07)①: db_backup 引擎键 — vacuum_into (案2, 默认: ro
  #   一致性快照直写 tmp, 无裸 .db 与 .gz 并存 = 病A 消灭; 中断 tmp 由
  #   下次运行开头自愈清扫) | staging (案1, 显式回退: SQLite backup API)。
  #   引擎病 (VACUUM OperationalError) 自动降级 staging + run 行 partial
  #   语义; 盘满/超时族不降级只 failed (案1 峰值 19.1G > 案2 17.7G,
  #   降级空跑再炸)。单次闸 = df 余量 > 源库×1.2 (运行时 getsize 自适应,
  #   代码面非本键), 与上方 floor_gb 地板键并行取严。
  db_backup_engine: vacuum_into
# ── F1 purgedcv 升级哨兵 (D-291 期1配套, 统筹 sm-58814c13363f4078) ──
# 顶层段全键空域 (禁 pipeline-block-scope 读法 — D-293 证伪陷阱面)。
# state: lightweight(默认,缺键同义) | strict(升级后) | keep_light(用户明裁);
# oos_trade_threshold: T1 阈值 (walk_forward 折叠 OOS 累计口径, 宁可少算不虚涨);
# stable_window_end: F2 稳定窗窗末日, 锚=回补批完成日 08-26 (jsonl run_finished
#   08-26 00:31:17 物证; 改基裁定 sm-5ab96e9e15aa4123 — 旧锚 08-29 系 GO-9
#   卷宗窗口包日期误标为批完成日, 勘正记档) → 锚日 08-26 + 14 天 = 2026-09-09
#   值由统筹 22:05 窗亲落 (本施工只做读侧, 不写值); 值即唯一事实源, 哨兵 T2 跟随键值。
purged_cv_upgrade:
  state: lightweight
  oos_trade_threshold: 50
  stable_window_end: "2026-09-09"
