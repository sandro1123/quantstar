      days: "1"
      depends_on: ["monthly_report"]
      timeout_s: 900
      max_retries: 1
      description: "Marimo 月报：绩效/因子轮换/纸面交易 vs 基准"

    db_backup:
      schedule: "23:00"
      days: "1-5"
      depends_on: []
      # 机制卡 (2026-09-07)③: 600→1800 — VACUUM INTO 15.6G 库实测 13min
      # (780s), 600s 必被 run_pipeline 掐成假失败; 1800s = 13min + gzip/IO
      # 余量。超时族语义 = 清 tmp + failed 不降级 (ghost 由判读哨接管)。
      timeout_s: 1800
      max_retries: 2
      description: "数据库备份：qs.db → data/backups/"

    incremental_backup:
      schedule: "23:05"
      days: "1-5"
      # v1.0 判据 6 (备份异地化): db_backup (全备) 之后跑增量 — 按表 dump
      # 当日行, 周二~周五的日差件 (周六日无新数据不跑, 周一归全备).
      depends_on: ["db_backup"]
      timeout_s: 300
      max_retries: 1
      description: "增量备份：按表 dump 当日行 → data/backups/incremental/"

    # ─── 每周 ──────────────────────────────────────
    weekly_summary:
      schedule: "08:00"
      days: "6"              # 周六
      depends_on: []
      # G8 2026-10-23: 保持 120s —— 实测 P90=1s Max=4s(近12次),
      #   120s 有 30 倍余量; 与代码默认 180s 不同属有意为之, 非隐患
      timeout_s: 120
      max_retries: 2
      description: "周报：本周绩效 + 最佳/最差 + 退出质量 + 策略调整"

    wfo_gate:
      schedule: "20:00"
      days: "0"              # 周日
      depends_on: []
      timeout_s: 600
      max_retries: 2
      retry_delay_s: 60
      description: "WFO 门禁验证：Walk-Forward 优化 → OOS Efficiency 门禁"

    param_tuning:
      schedule: "22:00"
      days: "0"              # 周日
      depends_on: ["wfo_gate"]
      timeout_s: 600
      max_retries: 2
      description: "参数调优：基于过去 7 天绩效 + 市场状态调整入场/出场参数"

    # ─── 每月 ──────────────────────────────────────
    model_retrain:
      schedule: "22:00"
      days: "1"              # 每月1日
      depends_on: []
      timeout_s: 1800
      max_retries: 1
      # (#110 2026-09-04) 数据腿预算真源 — 两腿拆外层静态 30s 超时装饰器后
