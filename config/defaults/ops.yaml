      days: "1-5"
      depends_on: []
      timeout_s: 30
      max_retries: 1
      wait_timeout_s: 7200

      description: "全层健康检查：所有 layer.health() + 报告 + 告警"

    intraday_monitor:
      schedule: "continuous"
      days: "1-5"
      depends_on: []
      timeout_s: 30
      max_retries: 1
      description: "盘中监控循环 (09:30-15:00 每5分钟)，由 systemd 管理"

    log_rotation:
      schedule: "23:30"
      days: "*"
      depends_on: []
      timeout_s: 60
      max_retries: 1
      description: "日志轮转：清理 30 天前的日志文件"

    disk_check:
      schedule: "hourly"
      days: "*"
      depends_on: []
