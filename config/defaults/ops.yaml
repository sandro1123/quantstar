      days: "1-5"
      # 当日截面验证依赖因子完成，不依赖 20:00 才生成的晚报。
      depends_on: ["factor_update"]
      # G8 2026-10-23: 60s → 180s (与晨报/晚报对齐; 原60s对 LLM 腿偏紧)
      timeout_s: 180
      # analyst 16:55 持锁 ~31min 吞 17:15 槽 (09-03 skipped_lock 铁证); 1200=等至 17:35 内
      # 让 analyst 尾 1852s+裕度; 超时=analyst 回退拆分量级的有用告警非病。
      wait_timeout_s: 1200
      max_retries: 1
      # 案A缩面 (2026-09-02): run_daily 全量镜像→核心链当日截面直查 (factor/kline/估值/指数+pool台账),
      # 零 run_daily 零计算链。实测墙钟 0.003s (qs-dvl/logs/dv_smoke_prod_ro.txt), 60s 预算裕度 >99%。
      # 旧 4天6连60s整秒超时根因=DevCompareSection 调 run_daily (60s 内跑不完 200s+ 级全量链)。
      description: "Dev 环境验证（轻量切片）：核心链当日截面新鲜度直查，非重跑"

    daily_ops_report:
      schedule: "17:30"
      days: "1-5"
      # W2-3 (2026-09-19): 剔除 evening_report 倒挂依赖 — 日报 17:30 依赖晚报
      # 20:00 = 结构性每天 skipped (09-15~18 四连实证); build_ops_report 消费
      # 运维统计/健康/告警面, 零消费晚报内容, 依赖本就冗余。daily_backtest
      # (15:55) 早于 17:30, 保留。
      depends_on: ["daily_backtest"]
      # G8 2026-10-23: 60s → 180s (与晨报/晚报对齐; 原60s对 LLM 腿偏紧)
      timeout_s: 180
      max_retries: 1
      description: "运维日报：各层健康 + 运行记录 + 版本 + 需关注"

    # ─── 仪表盘（a+c 双轨，2026-08-27 立项，施工稿见 vault 分层讨论/深挖报告-20260826/仪表盘施工稿-20260827.md）───
    dashboard_bitable_sync:
