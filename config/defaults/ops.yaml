      # #108 (2026-09-03): strategy.ic_horizon 嵌套撤出管道块 — handler
      # 读法改 Config 全键空间属主 (orchestrator _cfg_all, 先例
      # _dep_data_probe_enabled), 生产值迁 local.yaml strategy.ic_horizon
      # (config 门控键不再寄居调度块)。

    # AG-NEWS 运营段 (2026-09-13 注册面补齐, 统筹 sm-d7b43861): 个股新闻
    # 增量拉取 — 昨荐+活仓面 ~30 只经 PipelineInput.symbols 透传 per_stock_em 腿
    # (codes=None 不拉防打爆). 17:00 = DDP 15:30+2700s 窗末后稳避重叠.
