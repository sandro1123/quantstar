      max_retries: 1
      retry_delay_s: 60
      description: "晚间补采指数日线与龙虎榜，按业务日期及腿级状态验收"

    evening_report:
      # 宪法 #3 (2026-09-10 第一波): 晚报时间=交易日 20:00 (提前于 21:30 定稿)。
      # 旧 16:45 槽位空出; crontab 行由统筹窗内亲执 (本卡只改代码内调度配置)。
      schedule: "20:00"
      days: "1-5"
      depends_on: ["factor_update", "daily_backtest"]
      # G8 2026-10-23: 120s → 180s (P90=41s Max=48s(近30次), 佣塞日曾达120s+; 180=P90×4.4)
      timeout_s: 180
      # C 2026-10-23: max_retries 2 → 0 —— 近30天实测 4 fails / 3 timeout,
      #   是报告层唯一有实证超时失败的腿。重试是**完整重跑**
      #   (orchestrator:594 每轮重新 submit handler), 超时重试把 180s 变
      #   540s 且不治根因 (超时=预算不够或下游慢, 非瞬时故障)。
      #   根因治疗见 G9 reasoning_floor。
      max_retries: 0
      retry_delay_s: 15
      wait_timeout_s: 7200

      description: "晚报生成并推送：盘面总结 → 今日操作 → 个股精选 → 退出复盘"

    dev_verify_report:
