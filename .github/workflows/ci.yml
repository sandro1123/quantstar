name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11"  # 生产解释器钉死 (判例: 3.12 sum() Neumaier 与 3.11 位级差)
      - name: Install dependencies
        run: |
          pip install -e ".[dev]"
          pip install pytest-timeout
      - name: Check dependencies
        run: pip check
      - name: Compile check
        run: python3 -m compileall src/
      - name: Import smoke test
        run: PYTHONPATH=src python3 -c "from cli.main import cli; print('CLI import OK')"
      - name: Run unit tests
        run: |
          PYTHONPATH=src pytest tests/unit/ -q --timeout=120
        env:
          FUYAO_API_KEY: ${{ secrets.FUYAO_API_KEY }}
      - name: Run integration tests
        run: |
          PYTHONPATH=src pytest tests/integration/ -q --timeout=120
        env:
          FUYAO_API_KEY: ${{ secrets.FUYAO_API_KEY }}

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11"  # 生产解释器钉死 (判例: 3.12 sum() Neumaier 与 3.11 位级差)
      - name: Install ruff
        run: pip install ruff
      - name: Lint
        run: ruff check src/ --quiet

  build:
    needs: [test, lint]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3
      - name: Build
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25  # v5
        with:
          context: .
          load: true
          tags: quantstar:latest
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0
      - name: Fetch all tags
        run: git fetch --tags --force origin
      - name: Fetch gitleaks v8.18.4 (checksum-verified)
        run: |
          wget -q https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz
          wget -q https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_checksums.txt
          grep " gitleaks_8.18.4_linux_x64.tar.gz$" gitleaks_8.18.4_checksums.txt | sha256sum -c -
          tar xzf gitleaks_8.18.4_linux_x64.tar.gz gitleaks
      - name: Scan every branch and tag (not just the checked-out ref)
        run: ./gitleaks detect --source . --redact --no-banner --log-opts="--all"
      - name: Dependency audit
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt --progress-spinner off
